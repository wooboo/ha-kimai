[project]
name = "ha-kimai"
version = "0.1.0"
description = "Kimai time tracking integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
license = "MIT"
authors = [{ name = "Piotr Zabowka" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "pytest-homeassistant-custom-component==0.13.348",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=custom_components.kimai --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "D",
  "E",
  "F",
  "I",
  "ISC",
  "LOG",
  "PERF",
  "PIE",
  "PLC",
  "PLE",
  "PLW",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "COM812",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
